<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Arial', sans-serif;
        }

        #gameContainer {
            position: relative;
        }

        canvas {
            border: 3px solid white;
            background: black;
            display: block;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        #scoreboard {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            padding: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        #instructions {
            position: absolute;
            bottom: -60px;
            left: 0;
            right: 0;
            color: white;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="scoreboard">
            <div>Player: <span id="playerScore">0</span></div>
            <div>Computer: <span id="computerScore">0</span></div>
        </div>
        <div id="instructions">
            Use ARROW KEYS (↑↓) or MOUSE to move the left paddle
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const context = canvas.getContext('2d');
        const playerScoreDisplay = document.getElementById('playerScore');
        const computerScoreDisplay = document.getElementById('computerScore');

        // Game constants
        const PADDLE_WIDTH = 10;
        const PADDLE_HEIGHT = 100;
        const BALL_SIZE = 8;
        const PADDLE_SPEED = 7;
        const BALL_SPEED_INITIAL = 5;
        const COMPUTER_AI_SPEED = 0.08;

        // Game objects
        let player = {
            x: 10,
            y: (canvas.height - PADDLE_HEIGHT) / 2,
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT,
            speed: PADDLE_SPEED
        };

        let computer = {
            x: canvas.width - PADDLE_WIDTH - 10,
            y: (canvas.height - PADDLE_HEIGHT) / 2,
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT
        };

        let ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: BALL_SIZE,
            speedX: BALL_SPEED_INITIAL,
            speedY: BALL_SPEED_INITIAL * 0.6,
            maxSpeed: 8
        };

        let score = {
            player: 0,
            computer: 0
        };

        // Input handling
        let keys = {
            ArrowUp: false,
            ArrowDown: false
        };

        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowUp') {
                keys.ArrowUp = true;
            } else if (event.key === 'ArrowDown') {
                keys.ArrowDown = true;
            }
        });

        document.addEventListener('keyup', (event) => {
            if (event.key === 'ArrowUp') {
                keys.ArrowUp = false;
            } else if (event.key === 'ArrowDown') {
                keys.ArrowDown = false;
            }
        });

        canvas.addEventListener('mousemove', (event) => {
            const rect = canvas.getBoundingClientRect();
            const mouseY = event.clientY - rect.top;
            
            // Smooth mouse following
            if (mouseY > 0 && mouseY < canvas.height) {
                player.y = mouseY - player.height / 2;
            }
        });

        // Update game state
        function update() {
            // Player paddle movement (keyboard)
            if (keys.ArrowUp && player.y > 0) {
                player.y -= player.speed;
            }
            if (keys.ArrowDown && player.y < canvas.height - player.height) {
                player.y += player.speed;
            }

            // Constrain player paddle to canvas
            if (player.y < 0) player.y = 0;
            if (player.y > canvas.height - player.height) {
                player.y = canvas.height - player.height;
            }

            // Computer AI (smooth tracking)
            const computerCenter = computer.y + computer.height / 2;
            const ballCenter = ball.y;
            const difference = ballCenter - computerCenter;

            if (Math.abs(difference) > 10) {
                computer.y += difference * COMPUTER_AI_SPEED;
            }

            // Constrain computer paddle to canvas
            if (computer.y < 0) computer.y = 0;
            if (computer.y > canvas.height - computer.height) {
                computer.y = canvas.height - computer.height;
            }

            // Ball movement
            ball.x += ball.speedX;
            ball.y += ball.speedY;

            // Ball collision with top and bottom walls
            if (ball.y - ball.size < 0 || ball.y + ball.size > canvas.height) {
                ball.speedY = -ball.speedY;
                // Keep ball in bounds
                if (ball.y - ball.size < 0) ball.y = ball.size;
                if (ball.y + ball.size > canvas.height) ball.y = canvas.height - ball.size;
            }

            // Ball collision with paddles
            // Player paddle collision
            if (
                ball.x - ball.size < player.x + player.width &&
                ball.y > player.y &&
                ball.y < player.y + player.height &&
                ball.speedX < 0
            ) {
                ball.speedX = -ball.speedX;
                ball.x = player.x + player.width + ball.size;

                // Add spin based on where the ball hits the paddle
                let collidePoint = ball.y - (player.y + player.height / 2);
                collidePoint = collidePoint / (player.height / 2);
                ball.speedY = collidePoint * ball.maxSpeed * 0.75;

                // Increase ball speed slightly
                if (Math.abs(ball.speedX) < ball.maxSpeed) {
                    ball.speedX *= 1.05;
                }
            }

            // Computer paddle collision
            if (
                ball.x + ball.size > computer.x &&
                ball.y > computer.y &&
                ball.y < computer.y + computer.height &&
                ball.speedX > 0
            ) {
                ball.speedX = -ball.speedX;
                ball.x = computer.x - ball.size;

                // Add spin based on where the ball hits the paddle
                let collidePoint = ball.y - (computer.y + computer.height / 2);
                collidePoint = collidePoint / (computer.height / 2);
                ball.speedY = collidePoint * ball.maxSpeed * 0.75;

                // Increase ball speed slightly
                if (Math.abs(ball.speedX) < ball.maxSpeed) {
                    ball.speedX *= 1.05;
                }
            }

            // Ball out of bounds
            if (ball.x < 0) {
                score.computer++;
                computerScoreDisplay.textContent = score.computer;
                resetBall();
            }
            if (ball.x > canvas.width) {
                score.player++;
                playerScoreDisplay.textContent = score.player;
                resetBall();
            }
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            
            // Random direction
            const randomAngle = (Math.random() - 0.5) * 0.6;
            ball.speedX = (Math.random() > 0.5 ? 1 : -1) * BALL_SPEED_INITIAL;
            ball.speedY = randomAngle * ball.maxSpeed;
        }

        // Draw game objects
        function draw() {
            // Clear canvas with gradient effect
            context.fillStyle = '#000000';
            context.fillRect(0, 0, canvas.width, canvas.height);

            // Draw center line (dashed)
            context.strokeStyle = '#ffffff';
            context.setLineDash([10, 10]);
            context.beginPath();
            context.moveTo(canvas.width / 2, 0);
            context.lineTo(canvas.width / 2, canvas.height);
            context.stroke();
            context.setLineDash([]);

            // Draw paddles
            context.fillStyle = '#ffffff';
            context.fillRect(player.x, player.y, player.width, player.height);
            context.fillRect(computer.x, computer.y, computer.width, computer.height);

            // Draw ball
            context.fillStyle = '#ffffff';
            context.beginPath();
            context.arc(ball.x, ball.y, ball.size, 0, Math.PI * 2);
            context.fill();
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start the game
        gameLoop();
    </script>
</body>
</html>
